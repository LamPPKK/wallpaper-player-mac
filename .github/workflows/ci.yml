name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  swift:
    name: Swift tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Run 304+ Swift tests
        run: swift test --disable-sandbox
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app, XPC, and screen saver
        run: >-
          xcodebuild -project "Background Engine.xcodeproj"
          -scheme "Background Engine"
          -configuration Debug
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO build

  renderer-smoke:
    name: Renderer smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned renderer source
        run: |
          test "$(cat ExternalRenderers/wallpaperengine-mac-renderer/.background-engine-source-ref)" = "7acc6c92e0175d53e1cb6b2b2dff52f79faf83e0"
          test -f ExternalRenderers/wallpaperengine-mac-renderer/LICENSE
      - name: Install renderer dependencies
        run: brew install cmake lz4 sdl2 ffmpeg glfw glew glm mpv freetype dylibbundler
      - name: Build native renderer
        run: |
          cmake -S ExternalRenderers/wallpaperengine-mac-renderer -B renderer-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DWPENGINE_SCENE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build renderer-build --config Release --parallel
      - name: Smoke test CLI
        run: |
          ./Scripts/bundle-renderer-runtime.sh renderer-build/output/wwb-scene-renderer renderer-runtime
          /usr/bin/perl -e 'alarm 30; exec @ARGV' renderer-runtime/background-engine-scene-renderer --help
      - uses: actions/upload-artifact@v4
        with:
          name: scene-renderer-${{ matrix.arch }}
          path: renderer-runtime

  media-smoke:
    name: Bundled FFmpeg smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install gnupg
      - name: Build signed-source FFmpeg runtime
        env:
          FFMPEG_ARCHS: ${{ matrix.arch }}
        run: ./Scripts/build-ffmpeg-runtime.sh ffmpeg-runtime
      - name: Verify local-only media tools
        run: |
          ffmpeg-runtime/MediaTools/ffmpeg -hide_banner -version | grep 'ffmpeg version 9.0.1'
          ffmpeg-runtime/MediaTools/ffprobe -hide_banner -version | grep 'ffprobe version 9.0.1'
          test -z "$(ffmpeg-runtime/MediaTools/ffmpeg -hide_banner -protocols 2>/dev/null | grep -E '^  (http|https|tcp|udp)$' || true)"
          ffmpeg-runtime/MediaTools/ffmpeg -hide_banner -encoders 2>/dev/null | grep h264_videotoolbox
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-runtime-${{ matrix.arch }}
          path: ffmpeg-runtime

  package-shape:
    name: Universal package shape
    needs: [swift, renderer-smoke, media-smoke]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: scene-renderer-*
          path: renderer-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-runtime-*
          path: ffmpeg-artifacts
      - name: Merge packaged runtimes
        run: |
          ./Scripts/merge-renderer-runtime.sh renderer-artifacts/scene-renderer-arm64 renderer-artifacts/scene-renderer-x86_64 renderer-universal-runtime
          ./Scripts/merge-ffmpeg-runtime.sh ffmpeg-artifacts/ffmpeg-runtime-arm64 ffmpeg-artifacts/ffmpeg-runtime-x86_64 ffmpeg-universal-runtime
      - name: Build Universal Swift binaries
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Verify slices
        run: |
          BIN_DIR="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          lipo "$BIN_DIR/BackgroundEngine" -verify_arch arm64 x86_64
          lipo "$BIN_DIR/BackgroundEngineSteamCMDRunner" -verify_arch arm64 x86_64
      - name: Package self-contained unsigned DMG
        env:
          SCENE_RENDERER_RUNTIME_DIR: ${{ github.workspace }}/renderer-universal-runtime
          FFMPEG_RUNTIME_DIR: ${{ github.workspace }}/ffmpeg-universal-runtime
        run: ./Scripts/package-app.sh
      - name: Verify packaged runtime slices
        run: |
          APP="dist/Background Engine.app"
          lipo "$APP/Contents/MacOS/Background Engine" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/MediaTools/ffmpeg" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/MediaTools/ffprobe" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/Renderers/background-engine-scene-renderer" -verify_arch arm64 x86_64
          test -f dist/Background-Engine-0.2.0-alpha.1-macOS-universal.dmg
