name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: swift test --disable-sandbox

  renderer:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake lz4 sdl2 ffmpeg glfw glew glm mpv freetype dylibbundler
      - run: |
          cmake -S ExternalRenderers/wallpaperengine-mac-renderer -B renderer-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DWPENGINE_SCENE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build renderer-build --config Release --parallel
          ./Scripts/bundle-renderer-runtime.sh renderer-build/output/wwb-scene-renderer renderer-runtime
          /usr/bin/perl -e 'alarm 30; exec @ARGV' renderer-runtime/background-engine-scene-renderer --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-renderer-${{ matrix.arch }}
          path: renderer-runtime

  notarized-dmg:
    needs: [verify, renderer]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-renderer-*
          path: renderer-artifacts
      - name: Create portable Universal renderer runtime
        run: |
          ./Scripts/merge-renderer-runtime.sh renderer-artifacts/release-renderer-arm64 renderer-artifacts/release-renderer-x86_64 renderer-universal-runtime
          /usr/bin/perl -e 'alarm 30; exec @ARGV' renderer-universal-runtime/background-engine-scene-renderer --help
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Configure notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: >-
          xcrun notarytool store-credentials background-engine-notary
          --apple-id "$APPLE_ID"
          --team-id "$APPLE_TEAM_ID"
          --password "$APPLE_APP_PASSWORD"
      - name: Package, sign, notarize, staple, and assess
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_PROFILE: background-engine-notary
          REQUIRE_SIGNING: "1"
          REQUIRE_NOTARIZATION: "1"
          SCENE_RENDERER_RUNTIME_DIR: ${{ github.workspace }}/renderer-universal-runtime
        run: |
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          ./Scripts/package-app.sh
      - name: Create corresponding source archives
        run: |
          git archive --format=tar.gz --prefix=background-engine/ -o "dist/Background-Engine-${GITHUB_REF_NAME}-source.tar.gz" HEAD
          tar --exclude='.git' -czf "dist/wallpaperengine-mac-renderer-7acc6c9-source.tar.gz" -C ExternalRenderers wallpaperengine-mac-renderer
      - name: Write compatibility matrix
        run: |
          cp docs/COMPATIBILITY.md "dist/COMPATIBILITY.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.dmg dist/*.sha256 dist/*.json dist/*source.tar.gz dist/COMPATIBILITY.md
          --title "Background Engine $GITHUB_REF_NAME"
          --generate-notes
