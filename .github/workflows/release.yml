name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: New Git tag to create for this release; it must not already exist
        required: true
        type: string
      marketing_version:
        description: CFBundleShortVersionString written to the app, XPC service, and screen saver
        required: true
        default: 0.2.0-alpha.1
        type: string
      build_number:
        description: CFBundleVersion written to the app, XPC service, and screen saver
        required: true
        default: "12"
        type: string

permissions:
  contents: write

jobs:
  preflight:
    runs-on: macos-15
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      marketing_version: ${{ steps.metadata.outputs.marketing_version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve and validate release metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_CREATED: ${{ github.event.created }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_MARKETING_VERSION: ${{ inputs.marketing_version }}
          DISPATCH_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ./Scripts/resolve-release-metadata.sh \
            "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" "$TAG_CREATED" \
            "$DISPATCH_RELEASE_TAG" "$DISPATCH_MARKETING_VERSION" "$DISPATCH_BUILD_NUMBER" \
            >> "$GITHUB_OUTPUT"
      - name: Refuse an existing tag or GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: ./Scripts/verify-release-destination.sh "$EVENT_NAME" "$RELEASE_TAG" "$GITHUB_REPOSITORY"

  verify:
    needs: [preflight, media]
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-ffmpeg-${{ matrix.arch }}
          path: ffmpeg-runtime
      - name: Restore downloaded media-tool permissions
        run: chmod 755 ffmpeg-runtime/MediaTools/ffmpeg ffmpeg-runtime/MediaTools/ffprobe
      - name: Run every Swift test without skips
        env:
          BACKGROUND_ENGINE_FFMPEG: ${{ github.workspace }}/ffmpeg-runtime/MediaTools/ffmpeg
          BACKGROUND_ENGINE_FFPROBE: ${{ github.workspace }}/ffmpeg-runtime/MediaTools/ffprobe
        run: |
          set -o pipefail
          swift test --disable-sandbox 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"
          if /usr/bin/grep -Eq 'with [1-9][0-9]* tests? skipped' "$RUNNER_TEMP/swift-tests.log"; then
            echo "Swift test suite skipped one or more tests." >&2
            exit 1
          fi
      - name: Run app-hosted WebKit H.264 playback smoke
        env:
          TEST_FFMPEG: ${{ github.workspace }}/ffmpeg-runtime/MediaTools/ffmpeg
          TEST_FFPROBE: ${{ github.workspace }}/ffmpeg-runtime/MediaTools/ffprobe
        run: |
          set -o pipefail
          xcodebuild -project "Background Engine.xcodeproj" \
            -scheme "Background Engine" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/background-engine-app-host-derived" \
            -resultBundlePath "$RUNNER_TEMP/background-engine-app-host.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:BackgroundEngineAppTests/RestrictedWebWallpaperViewTests/testRealWKWebViewPlaysSeeksAndLoopsPreparedH264WithoutLegacyTypeHint \
            ARCHS=${{ matrix.arch }} \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            BACKGROUND_ENGINE_TEST_FFMPEG="$TEST_FFMPEG" \
            BACKGROUND_ENGINE_TEST_FFPROBE="$TEST_FFPROBE" \
            test 2>&1 | tee "$RUNNER_TEMP/app-host-webkit.log"
          if /usr/bin/grep -Eq 'with [1-9][0-9]* tests? skipped' "$RUNNER_TEMP/app-host-webkit.log"; then
            echo "The app-hosted WebKit smoke test was skipped." >&2
            exit 1
          fi
          /usr/bin/grep -Eq 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/app-host-webkit.log"

  renderer:
    needs: preflight
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./Scripts/install-renderer-dependencies.sh "$RUNNER_TEMP/renderer-homebrew-lock.tsv"
      - env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          cmake -S ExternalRenderers/wallpaperengine-mac-renderer -B renderer-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DWPENGINE_SCENE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build renderer-build --config Release --parallel
          ./Scripts/bundle-renderer-runtime.sh renderer-build/output/wwb-scene-renderer renderer-runtime
          cp "$RUNNER_TEMP/renderer-homebrew-lock.tsv" renderer-runtime/dependencies.lock.tsv
          /usr/bin/perl -e 'alarm 30; exec @ARGV' renderer-runtime/background-engine-scene-renderer --help
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-renderer-${{ matrix.arch }}
          path: renderer-runtime

  media:
    needs: preflight
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: brew install gnupg nasm
      - env:
          FFMPEG_ARCHS: ${{ matrix.arch }}
        run: ./Scripts/build-ffmpeg-runtime.sh ffmpeg-runtime
      - run: |
          FFMPEG="ffmpeg-runtime/MediaTools/ffmpeg"
          FFPROBE="ffmpeg-runtime/MediaTools/ffprobe"
          "$FFMPEG" -hide_banner -version | /usr/bin/grep 'ffmpeg version 9.0.1'
          "$FFPROBE" -hide_banner -version | /usr/bin/grep 'ffprobe version 9.0.1'
          test -z "$("$FFMPEG" -hide_banner -protocols 2>/dev/null | /usr/bin/grep -E '^  (concat|http|https|tcp|udp)$' || true)"
          "$FFMPEG" -hide_banner -encoders 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*V[^[:space:]]*[[:space:]]+h264_videotoolbox[[:space:]]'
          "$FFMPEG" -hide_banner -encoders 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*V[^[:space:]]*[[:space:]]+mpeg4[[:space:]]'
          "$FFMPEG" -hide_banner -encoders 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*A[^[:space:]]*[[:space:]]+aac[[:space:]]'
          "$FFMPEG" -hide_banner -decoders 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*V[^[:space:]]*[[:space:]]+png[[:space:]]'
          "$FFMPEG" -hide_banner -demuxers 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*D[[:space:]]+ogg[[:space:]]'
          "$FFMPEG" -hide_banner -demuxers 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*D[[:space:]]+matroska,webm[[:space:]]'
          "$FFMPEG" -hide_banner -demuxers 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*D[[:space:]]+avi[[:space:]]'
          for DECODER in vorbis opus theora vp8 vp9 mpeg4; do
            "$FFMPEG" -hide_banner -decoders 2>/dev/null | /usr/bin/grep -E "^[[:space:]]*[VA][^[:space:]]*[[:space:]]+${DECODER}[[:space:]]"
          done
          "$FFMPEG" -hide_banner -muxers 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*E[[:space:]]+mov[[:space:]]'
          "$FFMPEG" -hide_banner -muxers 2>/dev/null | /usr/bin/grep -E '^[[:space:]]*E[[:space:]]+avi[[:space:]]'
          SMOKE_DIR="$RUNNER_TEMP/background-engine-mpeg4-smoke"
          mkdir -p "$SMOKE_DIR"
          /bin/dd if=/dev/zero of="$SMOKE_DIR/frames.rgba" bs=4096 count=2
          "$FFMPEG" -hide_banner -nostdin -loglevel error \
            -f rawvideo -pixel_format rgba -video_size 32x32 -framerate 2 \
            -i "$SMOKE_DIR/frames.rgba" -frames:v 2 -an \
            -c:v mpeg4 -tag:v mp4v -pix_fmt yuv420p \
            -movflags +frag_keyframe+empty_moov+default_base_moof \
            "$SMOKE_DIR/fallback.mp4"
          "$FFPROBE" -v error -select_streams v:0 \
            -show_entries stream=codec_name,codec_tag_string \
            -of default=noprint_wrappers=1 "$SMOKE_DIR/fallback.mp4" > "$SMOKE_DIR/stream.txt"
          /usr/bin/grep -Eq '^codec_name=mpeg4$' "$SMOKE_DIR/stream.txt"
          /usr/bin/grep -Eq '^codec_tag_string=mp4v$' "$SMOKE_DIR/stream.txt"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-ffmpeg-${{ matrix.arch }}
          path: ffmpeg-runtime

  notarized-dmg:
    needs: [preflight, verify, renderer, media]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-renderer-*
          path: renderer-artifacts
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-ffmpeg-*
          path: ffmpeg-artifacts
      - name: Restore downloaded runtime permissions
        run: |
          chmod 755 renderer-artifacts/release-renderer-arm64/background-engine-scene-renderer
          chmod 755 renderer-artifacts/release-renderer-x86_64/background-engine-scene-renderer
          chmod 755 ffmpeg-artifacts/release-ffmpeg-arm64/MediaTools/ffmpeg ffmpeg-artifacts/release-ffmpeg-arm64/MediaTools/ffprobe
          chmod 755 ffmpeg-artifacts/release-ffmpeg-x86_64/MediaTools/ffmpeg ffmpeg-artifacts/release-ffmpeg-x86_64/MediaTools/ffprobe
      - name: Create portable Universal renderer runtime
        run: |
          ./Scripts/merge-renderer-runtime.sh renderer-artifacts/release-renderer-arm64 renderer-artifacts/release-renderer-x86_64 renderer-universal-runtime
          /usr/bin/perl -e 'alarm 30; exec @ARGV' renderer-universal-runtime/background-engine-scene-renderer --help
      - name: Create Universal FFmpeg runtime
        run: |
          ./Scripts/merge-ffmpeg-runtime.sh ffmpeg-artifacts/release-ffmpeg-arm64 ffmpeg-artifacts/release-ffmpeg-x86_64 ffmpeg-universal-runtime
          ffmpeg-universal-runtime/MediaTools/ffmpeg -hide_banner -version | /usr/bin/grep 'ffmpeg version 9.0.1'
          ffmpeg-universal-runtime/MediaTools/ffprobe -hide_banner -version | /usr/bin/grep 'ffprobe version 9.0.1'
          test -z "$(ffmpeg-universal-runtime/MediaTools/ffmpeg -hide_banner -protocols 2>/dev/null | /usr/bin/grep -E '^  (concat|http|https|tcp|udp)$' || true)"
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Configure notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: >-
          xcrun notarytool store-credentials background-engine-notary
          --apple-id "$APPLE_ID"
          --team-id "$APPLE_TEAM_ID"
          --password "$APPLE_APP_PASSWORD"
      - name: Package, sign, notarize, staple, and assess
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_PROFILE: background-engine-notary
          REQUIRE_SIGNING: "1"
          REQUIRE_NOTARIZATION: "1"
          SCENE_RENDERER_RUNTIME_DIR: ${{ github.workspace }}/renderer-universal-runtime
          FFMPEG_RUNTIME_DIR: ${{ github.workspace }}/ffmpeg-universal-runtime
          APP_VERSION: ${{ needs.preflight.outputs.marketing_version }}
          BUNDLE_VERSION: ${{ needs.preflight.outputs.build_number }}
        run: ./Scripts/package-app.sh
      - name: Verify packaged release metadata
        env:
          APP_VERSION: ${{ needs.preflight.outputs.marketing_version }}
          BUNDLE_VERSION: ${{ needs.preflight.outputs.build_number }}
        run: ./Scripts/verify-package-metadata.sh "${{ github.workspace }}/dist/Background Engine.app" "$APP_VERSION" "$BUNDLE_VERSION"
      - name: Verify packaged Universal slices
        run: |
          APP="dist/Background Engine.app"
          lipo "$APP/Contents/MacOS/Background Engine" -verify_arch arm64 x86_64
          lipo "$APP/Contents/MacOS/be-cli" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/MediaTools/ffmpeg" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/MediaTools/ffprobe" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/Renderers/background-engine-scene-renderer" -verify_arch arm64 x86_64
          lipo "$APP/Contents/XPCServices/BackgroundEngineSteamCMDRunner.xpc/Contents/MacOS/BackgroundEngineSteamCMDRunner" -verify_arch arm64 x86_64
          lipo "$APP/Contents/Resources/Background Engine.saver/Contents/MacOS/BackgroundEngineScreenSaver" -verify_arch arm64 x86_64
      - name: Create corresponding source archives
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          git archive --format=tar.gz --prefix=background-engine/ -o "dist/Background-Engine-${RELEASE_TAG}-source.tar.gz" HEAD
          ./Scripts/verify-source-archive.sh "dist/Background-Engine-${RELEASE_TAG}-source.tar.gz"
          tar --exclude='.git' -czf "dist/wallpaperengine-mac-renderer-7acc6c9-be4-source.tar.gz" -C ExternalRenderers wallpaperengine-mac-renderer
          cp ffmpeg-universal-runtime/Source/ffmpeg-9.0.1.tar.xz dist/
          cp ffmpeg-universal-runtime/Source/build-flags.txt dist/ffmpeg-9.0.1-build-flags.txt
      - name: Write compatibility matrix
        run: |
          cp docs/COMPATIBILITY.md "dist/COMPATIBILITY.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          MARKETING_VERSION: ${{ needs.preflight.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
        run: |
          ./Scripts/verify-release-destination.sh "$EVENT_NAME" "$RELEASE_TAG" "$GITHUB_REPOSITORY"
          release_assets=(
            dist/*.dmg
            dist/*.sha256
            dist/*.json
            dist/*source.tar.gz
            dist/ffmpeg-9.0.1.tar.xz
            dist/ffmpeg-9.0.1-build-flags.txt
            dist/COMPATIBILITY.md
          )
          release_options=(
            --title "Background Engine $MARKETING_VERSION ($BUILD_NUMBER)"
            --notes "Background Engine $MARKETING_VERSION, build $BUILD_NUMBER. Source tag: $RELEASE_TAG."
            --generate-notes
          )
          if [ "$EVENT_NAME" = "push" ]; then
            release_options+=(--verify-tag)
          else
            release_options+=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" "${release_assets[@]}" "${release_options[@]}"
